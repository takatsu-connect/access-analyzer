# 日次バッチ（03 §1〜§2、§8〜§10、§14、06 §9、ADR 0009）。
# - schedule: UTC 08:00（JST 17:00）と保険の UTC 09:00（JST 18:00）。2 回目は preflight が同じ基準日の成功を見て何もしない。
# - workflow_dispatch: mode（daily / backfill / publish_only）、from、to（backfill だけ）、base_date（試験・再実行用）。
# - 依頼者が本番の設定を終えるまで動かさない: リポジトリの Variable DAILY_ENABLED が 'true' のときだけ実行する。
# - 入力は env で渡し、run の中で式を展開しない（スクリプトの注入を防ぐ）。値の形はバッチが pydantic と argparse で検証する。
# - ログに出るのは件数、所要時間、エラーの種別だけ（03 §15）。失敗の通知は GitHub の失敗メール（Q-12）。
name: daily

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily / backfill / publish_only"
        type: choice
        options: [daily, backfill, publish_only]
        default: daily
      from:
        description: "backfill の開始日 YYYY-MM-DD（空なら BACKFILL_START）"
        type: string
        required: false
        default: ""
      to:
        description: "backfill の終了日 YYYY-MM-DD（空なら基準日）"
        type: string
        required: false
        default: ""
      base_date:
        description: "基準日 YYYY-MM-DD（試験用。通常は空）"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# 日次・backfill・publish_only を通して 1 本ずつ。走っているものは取り消さない
concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  daily:
    if: >-
      github.ref == 'refs/heads/main' && vars.DAILY_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.mode == 'daily')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: 依存を入れる（ハッシュ固定、wheel だけ）
        working-directory: apps/batch
        run: python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: GCP に WIF で認証する
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: 日次バッチ
        working-directory: apps/batch
        env:
          PYTHONPATH: src
          SUPABASE_BATCH_DB_URL: ${{ secrets.SUPABASE_BATCH_DB_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          BASE_DATE: ${{ inputs.base_date }}
        run: python -m takatsu_batch daily

  backfill:
    if: >-
      github.ref == 'refs/heads/main' && vars.DAILY_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: 依存を入れる（ハッシュ固定、wheel だけ）
        working-directory: apps/batch
        run: python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: GCP に WIF で認証する
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: バックフィル
        working-directory: apps/batch
        env:
          PYTHONPATH: src
          SUPABASE_BATCH_DB_URL: ${{ secrets.SUPABASE_BATCH_DB_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          BASE_DATE: ${{ inputs.base_date }}
          BACKFILL_FROM: ${{ inputs.from }}
          BACKFILL_TO: ${{ inputs.to }}
        # from と to が空なら引数を付けない（03 §10。バッチが既定値を決める）
        run: |
          set -euo pipefail
          args=(backfill)
          if [ -n "${BACKFILL_FROM}" ]; then args+=(--from "${BACKFILL_FROM}"); fi
          if [ -n "${BACKFILL_TO}" ]; then args+=(--to "${BACKFILL_TO}"); fi
          python -m takatsu_batch "${args[@]}"

  # 工程 7（Deploy Hook）だけ。渡すのは VERCEL_DEPLOY_HOOK_URL だけで、GCP の認証もしない（03 §16）
  publish_only:
    if: >-
      github.ref == 'refs/heads/main' && vars.DAILY_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'publish_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: 依存を入れる（ハッシュ固定、wheel だけ）
        working-directory: apps/batch
        run: python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: Deploy Hook を呼ぶ
        working-directory: apps/batch
        env:
          PYTHONPATH: src
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: python -m takatsu_batch publish_only
