# 依存の週 1 の監査（06 §10 の W-9、07 S-08）。PR のない週に公表された脆弱性に気づくため。
# ci.yml の deps-audit と同じ検査。Secrets と Environment を参照しない。失敗は GitHub の失敗メールで届く。
name: audit

on:
  schedule:
    # 毎週月曜 UTC 00:00（JST 09:00）
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: pip-audit を入れる（ハッシュ固定、wheel だけ）
        run: python -m pip install --require-hashes --only-binary :all: -r .github/requirements/audit.txt
      - name: pip-audit（apps/batch/requirements.txt）
        run: bash .github/scripts/pip-audit.sh

  pnpm-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.6.5"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
      - name: pnpm audit（高以上で失敗）
        working-directory: apps/web
        run: pnpm audit --audit-level=high
