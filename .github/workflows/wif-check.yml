# WIF の動作確認（docs/operations/initial_setup.md §2「動作確認」、deploy.md 手順 2）。手動実行だけ。
# WIF で SA のアクセストークンを得て、GA4 Data API を 1 回呼ぶ。
# ログに出すのは HTTP の状態コードと行数だけ。応答の本文、トークン、プロパティ ID は出さない。
name: wif-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wif-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: GCP に WIF で認証する（アクセストークンを出す。資格情報ファイルは作らない）
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: GA4 Data API を 1 回呼ぶ（直近 7 日の PV）
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/wif-check.json"
          status="$(curl -s -o "${body}" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"dateRanges":[{"startDate":"7daysAgo","endDate":"yesterday"}],"metrics":[{"name":"screenPageViews"}]}' \
            "https://analyticsdata.googleapis.com/v1beta/properties/${GA4_PROPERTY_ID}:runReport" || echo "000")"
          rows="$(jq -r '(.rows // []) | length' "${body}" 2>/dev/null || echo "?")"
          rm -f "${body}"
          echo "status=${status} rows=${rows}"
          test "${status}" = "200"
